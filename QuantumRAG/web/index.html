<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuantumRAG Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%232D6FB7' stroke-width='2.5'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='4.5' fill='none' stroke='%23A2449A' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%230F9B86'/%3E%3C/svg%3E">
</head>
<body>
<div class="shell">
  <aside class="rail" aria-label="Main navigation">
    <a class="brand" href="#/retrieve">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
        <circle cx="16" cy="16" r="12" fill="none" stroke="var(--c-classical)" stroke-width="2.2"/>
        <ellipse cx="16" cy="16" rx="12" ry="4.5" fill="none" stroke="var(--c-quantum)" stroke-width="1.8"/>
        <circle cx="16" cy="16" r="2.6" fill="var(--c-hybrid)"/>
      </svg>
      <span>QuantumRAG</span>
    </a>
    <nav>
      <a href="#/retrieve" data-route="retrieve">Retrieve</a>
      <a href="#/circuit" data-route="circuit">Circuit</a>
      <a href="#/benchmarks" data-route="benchmarks">Benchmarks</a>
      <a href="#/corpus" data-route="corpus">Corpus</a>
      <a href="#/method" data-route="method">Method</a>
    </nav>
    <div class="rail-status" id="rail-status" aria-live="polite">
      <p class="muted">Loading the corpus and embeddings.</p>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch colour theme">Dark theme</button>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<script src="/static/app.js" type="module"></script>
</body>
</html>
